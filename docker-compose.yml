services:
  traefik:
    # NOTE: the plan specifies traefik:v3.1, but this host runs Docker Engine 29.6.1
    # (API 1.55, minimum supported client API 1.40). traefik:v3.1's bundled docker
    # client always requests API 1.24, which that daemon rejects outright
    # ("client version 1.24 is too old"), so the Docker provider never starts and no
    # routers get created (see traefik/traefik#12253). This was fixed in traefik
    # v3.6.1 (auto-negotiation of the docker API version), so v3.6 is pinned here
    # instead of v3.1 to make the stack work on this host.
    image: traefik:v3.6
    restart: unless-stopped
    # apps/api/src/main.ts sets `trust proxy: true`, which is only safe
    # because Traefik overwrites X-Forwarded-For from the real connection
    # rather than passing through a client-supplied one. If this topology
    # ever changes (another hop added in front of Traefik, e.g. a
    # Kubernetes Ingress or cloud LB), that `trust proxy` setting must
    # change too — see the comment in main.ts before altering this.
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # File provider: supplies the TLS certificate store (traefik/dynamic.yml)
      # for the mkcert-issued cert -- the Docker label provider above can't
      # declare manually-supplied static certificates on its own.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Global HTTP->HTTPS redirect: anything hitting the web (:80)
      # entrypoint is redirected to the websecure (:443) entrypoint before
      # it ever reaches a router, so every host (app/api/auth/storage) gets
      # the same behavior without per-router redirect middleware.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./traefik/certs:/certs:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"  # loopback-only: host 5432 may already be taken by an unrelated local Postgres; container-internal port stays 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # --save "" --appendonly no disables persistence: this Redis instance is
    # purely a BullMQ job queue backend, not a source of truth; losing
    # queued-but-not-yet-processed jobs on a restart is an acceptable
    # dev-environment tradeoff, not data loss of anything durable.
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6380:6379"  # loopback-only: host-side test access, matching Postgres/Traefik-dashboard convention. Not what the api/worker containers use (they use the internal redis:6379 hostname/port, see the api service's REDIS_HOST/REDIS_PORT below).
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    # H2 (Keycloak's embedded dev-mode DB) can corrupt its data files if the
    # JVM is killed mid-write rather than shut down cleanly. Docker's default
    # stop timeout (10s) is not always enough for Keycloak's JVM to finish
    # an in-flight H2 write before SIGKILL lands -- this happened for real
    # during this project's history (see scripts/backup.sh's own `docker
    # compose stop -t 30 ...` for the narrower, single-call-site version of
    # this same fix). stop_grace_period is the service-level, always-applies
    # version: it protects against ANY stop/recreate of this container
    # (`docker compose stop`, `up -d` recreation, systemd, etc.), not just
    # the specific invocations backup.sh happens to control.
    stop_grace_period: 30s
    command: start-dev --import-realm
    entrypoint: ["/entrypoint.sh"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: auth.${DRM_BASE_DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Traefik terminates TLS at the edge and proxies to Keycloak over
      # plain HTTP internally (see traefik.http.services.keycloak.loadbalancer
      # .server.port=8080 below) -- Keycloak has no way to know the original
      # external request was HTTPS unless it's told to trust the
      # X-Forwarded-Proto/X-Forwarded-Host headers Traefik sets. Without
      # this, Keycloak builds its issuer/external URLs (e.g. the `iss` claim
      # on issued tokens) as http://, which then fails apps/api's issuer
      # check against KEYCLOAK_ISSUER (https://...) below. Verified against
      # Keycloak 25's own config reference: `proxy-headers` / KC_PROXY_HEADERS
      # (values: forwarded, xforwarded) "takes precedence over the
      # deprecated proxy option" -- xforwarded matches Traefik's
      # X-Forwarded-* headers specifically.
      KC_PROXY_HEADERS: xforwarded
      # Consumed by keycloak/entrypoint.sh to render realm-export.json.template
      # (__APP_HOST__ placeholder) before handing off to kc.sh -- see that
      # script for why this can't just be compose-interpolated directly like
      # KC_HOSTNAME above (this file is mounted into the container, not part
      # of this YAML).
      DRM_APP_HOST: app.${DRM_BASE_DOMAIN}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/entrypoint.sh:/entrypoint.sh:ro
      - ./keycloak/realm-export.json.template:/template/realm-export.json.template:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`auth.${DRM_BASE_DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KEYCLOAK_ISSUER: https://auth.${DRM_BASE_DOMAIN}/realms/drm
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/drm/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: drm-web
      WEB_ORIGIN: https://app.${DRM_BASE_DOMAIN}
      PORT: 3000
      # Phase 2B document storage: not consumed by application code yet
      # (that's Phase 2B's job), just provisioned and wired through here so
      # the scoped credential is reachable once that code lands. Credential
      # itself is created by minio-init (see minio/entrypoint.sh) with an
      # IAM policy scoped to only the 'documents' bucket -- see
      # minio/drm-api-policy.json.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: documents
      MINIO_ACCESS_KEY: ${MINIO_API_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_API_SECRET_KEY}
      # Phase 4A: internal Docker-network address/port for the BullMQ
      # producer (apps/api/src/jobs). The 127.0.0.1:6380 loopback publish
      # on the redis service below is only for host-side test access, not
      # what this container uses to reach Redis.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Phase 4B: VirusScanService's clamdscan TCP target -- the clamav
      # service below, reachable over the internal Docker network only.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # OnlyOffice 僅經 API 的短效授權 URL 取得文件，沒有 MinIO/KES 憑證。
      ONLYOFFICE_URL: https://office.${DRM_BASE_DOMAIN}
      API_PUBLIC_URL: https://api.${DRM_BASE_DOMAIN}
      # 僅供 OnlyOffice 取得文件與回呼儲存使用，永不提供給瀏覽器。
      ONLYOFFICE_API_URL: http://api:3000
      # 僅供 API 從 OnlyOffice 取回已編輯的短效暫存檔，避開內部 CA 信任鏈。
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # VirusScanService's constructor calls clamscan's init(), which pings
      # clamd immediately at boot (bypassTest defaults to false). Without
      # this, the api container can start (and pass its own healthcheck)
      # before clamd has finished the multi-minute first-boot freshclam
      # download, and every upload would fail at the scan step for
      # however long the api container has already been "up".
      clamav:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${DRM_BASE_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=3000

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Phase 4B: StorageService's MinIO client + ConversionProcessor's
      # Gotenberg target, same env var names/values as the api service
      # above (see the api service's MINIO_* comment for the credential
      # provisioning story).
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: documents
      MINIO_ACCESS_KEY: ${MINIO_API_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_API_SECRET_KEY}
      GOTENBERG_URL: http://gotenberg:3000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    restart: unless-stopped

  gotenberg:
    # Phase 4A: document-to-PDF conversion service, consumed over the
    # internal Docker network only (no host port publish -- nothing outside
    # the compose network needs direct access). Health-checked via
    # Gotenberg's own /health endpoint, which reports real liveness of its
    # internal Chromium/LibreOffice modules, not just "container is up".
    image: gotenberg/gotenberg:8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  onlyoffice:
    # 文件服務沒有 MinIO、PostgreSQL 或 OpenBao 憑證；僅能從 API 的受控 URL
    # 取得有效分享的內容。其暫存區必須位於主機加密磁碟，並由維運排程清理。
    image: onlyoffice/documentserver:8.3.1
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: AuthorizationJwt
    labels:
      - traefik.enable=true
      - traefik.http.routers.onlyoffice.rule=Host(`office.${DRM_BASE_DOMAIN}`)
      - traefik.http.routers.onlyoffice.entrypoints=websecure
      - traefik.http.routers.onlyoffice.tls=true
      - traefik.http.routers.onlyoffice.middlewares=onlyoffice-forwarded-https
      - traefik.http.services.onlyoffice.loadbalancer.server.port=80
      - traefik.http.middlewares.onlyoffice-forwarded-https.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.onlyoffice-forwarded-https.headers.customresponseheaders.Content-Security-Policy=upgrade-insecure-requests
    tmpfs:
      - /var/lib/onlyoffice/documentserver/App_Data/cache/files:rw,noexec,nosuid,size=1g

  clamav:
    # Phase 4A: virus-scanning daemon, consumed over the internal Docker
    # network only (no host port publish) via clamd's INSTREAM protocol on
    # 3310. start_period is deliberately generous -- first-boot virus
    # definition database download (freshclam) can take several minutes and
    # is network-dependent; this is expected, not a sign of a broken
    # container. Observed ~13 minutes to healthy on this host (under memory
    # pressure); start_period is set to 900s so that value alone covers a
    # slow first boot, rather than relying on the implicit extra grace
    # period Docker grants via retries*interval after start_period expires.
    # Virus definitions (~175MB, downloaded from an external freshclam
    # mirror) are persisted in the clamav_data named volume rather than the
    # container's writable layer, so a `docker compose down`/`up --build`/
    # image bump reuses the already-downloaded database instead of paying
    # the multi-minute re-download (and depending on the mirror being
    # reachable) every single time. Only `docker compose down -v` (or
    # deleting the volume directly) forces a fresh download again.
    # Healthcheck uses the image's own bundled clamdcheck.sh, confirmed
    # present in clamav/clamav:stable via `docker compose exec clamav which
    # clamdcheck.sh`.
    #
    # NOTE: the plan's draft used `test: ["CMD", "sh", "-c", "clamdcheck.sh
    # || echo unhealthy"]`. That form always exits 0 (the `echo` on the
    # right of `||` always succeeds), so Docker reported the container
    # "healthy" 13s after start -- while its own logs still showed "Socket
    # for clamd not found yet, retrying" (freshclam hadn't even finished
    # its first database check yet). Confirmed by manually running
    # `clamdcheck.sh || echo unhealthy` in the running container: it prints
    # "ERROR: Unable to contact server" + "unhealthy" but still exits 0.
    # Using clamdcheck.sh directly as CMD lets its real exit code (1 when
    # clamd is unreachable) reach Docker's healthcheck evaluation.
    image: clamav/clamav:stable
    environment:
      # This image's own /init entrypoint script (confirmed by reading it
      # directly in the running container) applies any CLAMD_CONF_<KEY> env
      # var to /etc/clamav/clamd.conf on every container start, via
      # `sed -i "s/^#<KEY> .*/<KEY> <VALUE>/" clamd.conf` -- i.e. this is the
      # image's own supported override mechanism, not a bind-mounted config
      # file. Both directives default to 100M (confirmed via
      # `docker compose exec clamav grep -i streammaxlength/maxfilesize
      # /etc/clamav/clamd.conf`), well under apps/api's 200MB
      # MAX_UPLOAD_BYTES (documents.controller.ts) -- a 110MB upload would
      # get clamd's own "INSTREAM size limit exceeded" ERROR response,
      # which used to surface as a raw 500 (see VirusScanService.scanBuffer
      # and DocumentsService.rejectIfInfected for the typed-413 handling of
      # that response, kept as defense in depth even with this raised).
      # 220M gives 20MB of headroom above the 200MB app-level cap.
      CLAMD_CONF_StreamMaxLength: 220M
      CLAMD_CONF_MaxFileSize: 220M
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_KEYCLOAK_ISSUER: https://auth.${DRM_BASE_DOMAIN}/realms/drm
        VITE_KEYCLOAK_CLIENT_ID: drm-web
        VITE_API_BASE_URL: https://api.${DRM_BASE_DOMAIN}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`app.${DRM_BASE_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.services.web.loadbalancer.server.port=80

  openbao:
    image: openbao/openbao:latest
    restart: unless-stopped
    command: server -config=/openbao/config.hcl
    cap_add:
      - IPC_LOCK
    volumes:
      - ./openbao/config.hcl:/openbao/config.hcl:ro
      - openbao_data:/openbao/file
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"]
      interval: 5s
      timeout: 5s
      retries: 20

  openbao-init:
    build:
      context: ./openbao
      dockerfile: init.Dockerfile
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # Run as root only long enough for entrypoint.sh to chown the
    # freshly-created (root-owned) openbao_init/openbao_approle volumes to
    # the image's non-root "openbao" user (uid 100 / gid 1000), then it drops privileges
    # via su-exec before running init.sh. init.sh itself -- the part that
    # talks to the OpenBao HTTP API and writes secrets -- never runs as
    # root. See openbao/entrypoint.sh for details.
    user: "0:0"
    volumes:
      - ./openbao/entrypoint.sh:/entrypoint.sh:ro
      - ./openbao/init.sh:/init.sh:ro
      # Two SEPARATE volumes, not one shared one: openbao_init holds the
      # unseal key + root token (full KMS control) and is mounted ONLY
      # here; openbao_approle holds just the scoped AppRole role_id/
      # secret_id and is also mounted read-only into kes below. Since
      # minio/kes:latest runs as root, file permissions can't protect
      # openbao-init.json from a compromised KES container -- volume
      # separation is the only thing that does. See kes's volumes for the
      # other half of this split.
      - openbao_init:/init
      - openbao_approle:/approle
    depends_on:
      openbao:
        condition: service_healthy
    restart: "no"

  kes:
    image: minio/kes:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./kes/entrypoint.sh:/entrypoint.sh:ro
      - ./kes/server-config.yaml.template:/template/server-config.yaml.template:ro
      - ./secrets/kes:/certs:ro
      # Only the AppRole volume -- NOT openbao_init, which holds the
      # OpenBao unseal key/root token. See openbao-init's volumes above.
      - openbao_approle:/shared:ro
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:7373:7373"  # loopback-only: local debugging/mc/curl access, matching Postgres/Traefik dashboard convention
    healthcheck:
      # minio/kes:latest has no curl/wget (confirmed: it's a minimal
      # coreutils+bash image, see the note in entrypoint.sh), so this uses
      # the `kes` binary's own CLI (`kes status`) instead of an HTTP tool.
      # `kes status` mTLS-authenticates as the minio-client identity
      # (KES_CLIENT_CERT/KEY below) and calls the server's /v1/status API
      # over HTTPS on 127.0.0.1:7373 -- a real end-to-end check that the
      # HTTPS listener is up, TLS is serving the right cert, and the
      # identity/policy chain works, not just "is a process running".
      # /v1/status was added to the minio identity's policy allow-list
      # specifically for this (admin.identity is disabled, so there's no
      # separate admin identity available to call it).
      test:
        [
          "CMD-SHELL",
          "KES_CLIENT_CERT=/certs/minio-client.cert KES_CLIENT_KEY=/certs/minio-client.key /kes status -k -s",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_KMS_KES_ENDPOINT: https://kes:7373
      MINIO_KMS_KES_CERT_FILE: /certs/minio-client.cert
      MINIO_KMS_KES_KEY_FILE: /certs/minio-client.key
      # NOTE: the plan's draft used MINIO_KMS_KES_CA_PATH, but that env var does not
      # exist in minio/minio:latest -- confirmed by extracting the `minio` binary from
      # the image and grepping its embedded string table for `MINIO_KMS_KES_`, which
      # only lists API_KEY, CAPATH (no underscore before PATH), CERT_FILE, ENDPOINT,
      # KEY_FILE, KEY_NAME, KEY_PASSWORD. MINIO_KMS_KES_CA_PATH is silently ignored,
      # which would leave MinIO trusting only the system CA pool and failing TLS
      # verification against KES's self-signed server cert.
      MINIO_KMS_KES_CAPATH: /certs/kes-server.cert
      MINIO_KMS_KES_KEY_NAME: drm-default-key
    ports:
      - "127.0.0.1:9000:9000"  # loopback-only: direct S3 API access for smoke-test/mc, matching Postgres/Traefik-dashboard convention. Console (9001) stays reachable only via Traefik at storage.${DRM_BASE_DOMAIN}.
    volumes:
      - minio_data:/data
      - ./secrets/kes:/certs:ro
    depends_on:
      kes:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-console.rule=Host(`storage.${DRM_BASE_DOMAIN}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # Idempotently provisions the 'documents' bucket (with default SSE-KMS
    # encryption via drm-default-key) so it exists automatically on every
    # fresh `docker compose up`, rather than only as a side effect of
    # someone happening to run scripts/verify-encrypted-storage.sh.
    # Follows the same one-shot pattern as openbao-init.
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_ACCESS_KEY: ${MINIO_API_ACCESS_KEY}
      MINIO_API_SECRET_KEY: ${MINIO_API_SECRET_KEY}
    volumes:
      - ./minio/entrypoint.sh:/entrypoint.sh:ro
      - ./minio/drm-api-policy.json:/policy/drm-api-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  keycloak_data:
  openbao_data:
  openbao_init:
  openbao_approle:
  minio_data:
  redis_data:
  clamav_data:
