name: 品質閘門

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-sonar:
    # SonarQube Cloud 由 GitHub hosted runner 透過 HTTPS 連線，不需維護地端 runner。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取得完整 Git 歷史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 啟用 Corepack
        run: corepack enable

      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile

      - name: 執行 API 測試
        run: pnpm --filter api test -- --runInBand

      - name: 執行前端測試
        run: pnpm --filter web test

      - name: 執行 SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
