sonar.projectKey=misawa3017_DRM
sonar.projectName=DRM
sonar.organization=misawa3017
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# 僅掃描應用程式與共用套件的正式原始碼；測試會由 CI 先執行。
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**

# CI 必須等待 Quality Gate 結果；紅燈即令掃描工作失敗。
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
