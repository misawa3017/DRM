# Traefik file-provider dynamic configuration.
#
# The Docker label provider (see docker-compose.yml's traefik service +
# each router's labels) can declare routers/services/middlewares, but it
# cannot declare TLS certificate stores from manually-supplied cert/key
# files -- that's only expressible via the file provider. This file is
# mounted read-only into the traefik container (see docker-compose.yml)
# and watched for changes (--providers.file.watch=true).
#
# certFile/keyFile below are IN-CONTAINER paths -- traefik/certs on the
# host is bind-mounted to /certs:ro in the traefik service. Certificate
# chain and private key are issued/managed by the internal CA and remain
# gitignored on the deployment host.
tls:
  certificates:
    - certFile: /certs/drm.apower.lan.bundle.pem
      keyFile: /certs/drm.apower.lan-key.pem
